<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Treecord Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    />
    <style>
      :root {
        --bg: #f7f6f2;
        --surface: #ffffff;
        --text: #1c1f1d;
        --muted: #6b726e;
        --primary: #1f5d3a;
        --soft: #e6f0e9;
        --verified: #2e9e5b;
        --gutter: clamp(16px, 6vw, 96px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      svg {
        display: block;
      }

      /* ---------- beats */
      .beat {
        position: relative;
        height: 100vh;
        height: 100svh;
        overflow: hidden;
        display: grid;
        align-items: center;
        padding: 0 var(--gutter);
      }
      .beat--center {
        place-items: center;
        text-align: center;
      }
      .beat--center > * {
        grid-area: 1 / 1;
      }
      .beat--split {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: clamp(16px, 4vw, 64px);
      }
      .beat--stack {
        grid-template-rows: auto minmax(0, 1fr);
        align-items: start;
        padding-top: 10vh;
        padding-bottom: 6vh;
      }
      .beat--strip {
        padding: 0;
      }
      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(16px, 4vw, 48px);
        min-width: 0;
        min-height: 0;
        height: 100%;
      }
      .bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        width: 100%;
        background: var(--verified);
        transform-origin: left;
        transform: scaleX(0);
      }

      /* ---------- words: every .say in a .copy shares one grid cell, so they swap in place */
      .copy {
        display: grid;
      }
      .say {
        grid-area: 1 / 1;
        align-self: center;
        position: relative;
        isolation: isolate; /* keeps the highlighter layer behind the words but above the page */
      }
      .big {
        margin: 0;
        font-size: clamp(34px, 5.4vw, 76px);
        font-weight: 800;
        line-height: 1.04;
        letter-spacing: -0.035em;
        max-width: 14ch;
      }
      /* line masks: room for descenders (g, y, p) without moving layout */
      .ln-mask {
        padding: 0.1em 0 0.22em;
        margin: -0.1em 0 -0.22em;
      }
      .big--m {
        font-size: clamp(26px, 3.6vw, 48px);
        max-width: 20ch;
      }
      .beat--center .big,
      .beat--stack .big,
      .panel .big {
        margin-inline: auto;
      }
      .beat--stack .copy,
      .panel .copy {
        text-align: center;
      }
      .num {
        font:
          700 0.42em 'JetBrains Mono',
          monospace;
        color: var(--verified);
        vertical-align: 0.9em;
        margin-right: 0.35em;
        letter-spacing: 0;
      }

      /* ---------- hand-drawn marks on words (drawn by preview.js) */
      .fx {
        white-space: nowrap; /* a marked phrase never breaks, so its mark is one clean stroke */
      }
      .fx-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
      }
      .fx-layer--back {
        z-index: -1;
      }
      .fx-layer svg {
        position: absolute;
        overflow: visible;
      }

      /* ---------- ghost word drifting behind each beat */
      .ghost {
        position: absolute;
        top: 50%;
        left: 0;
        translate: 0 -50%;
        font-size: 24vw;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        white-space: nowrap;
        color: transparent;
        -webkit-text-stroke: 1.5px rgb(31 93 58 / 0.13);
        pointer-events: none;
        user-select: none;
      }
      .copy,
      .stage,
      .brand,
      .strip {
        position: relative;
        z-index: 1;
      }

      /* ---------- hero */
      .brand {
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: clamp(12px, 2vw, 28px);
      }
      .wordmark {
        font-size: clamp(44px, 8vw, 104px);
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      /* ---------- problems strip */
      .strip {
        display: flex;
        height: 100%;
        width: max-content;
      }
      .panel {
        width: 100vw;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 28px;
        padding: 0 var(--gutter);
      }

      /* ---------- roles + cta */
      .roles {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: clamp(20px, 4vw, 56px);
      }
      .roles figure {
        margin: 0;
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      .roles figcaption {
        position: relative;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: clamp(16px, 1.6vw, 22px);
      }
      .cta {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 36px;
      }
      .btn {
        font:
          600 16px 'Plus Jakarta Sans',
          sans-serif;
        padding: 14px 22px;
        border-radius: 12px;
        text-decoration: none;
        border: 2px solid var(--primary);
        color: var(--primary);
      }
      .btn--primary {
        background: var(--primary);
        color: #fff;
      }
      .btn:focus-visible {
        outline: 3px solid var(--verified);
        outline-offset: 3px;
      }

      @media (max-width: 760px) {
        .beat--split {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
          align-items: start;
          padding-top: 10vh;
          text-align: center;
        }
        .beat--split .big {
          margin-inline: auto;
        }
        .stage {
          flex-direction: column;
        }
      }

      /* ---------- asset sheet (review only) */
      .sheet {
        max-width: 1100px;
        margin: 0 auto;
        padding: 96px 16px 64px;
      }
      .sheet h2 {
        font:
          700 13px 'JetBrains Mono',
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .sheet-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }
      .cell {
        background: var(--surface);
        border-radius: 12px;
        padding: 16px;
        display: grid;
        gap: 10px;
        justify-items: center;
      }
      .cell svg {
        width: 100%;
        height: 120px;
      }
      .cell span {
        font:
          12px 'JetBrains Mono',
          monospace;
        color: var(--muted);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js",
          "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/"
        }
      }
    </script>
  </head>
  <body>
    <main id="beats"></main>
    <section class="sheet">
      <h2>Asset sheet</h2>
      <div class="sheet-grid" id="sheet"></div>
    </section>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
